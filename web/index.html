<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Images only from the app (fig: icons, figo:) or inline (data:); requests only to the page's
      own origin and the app's figo: scheme (specs index, themes). Nothing reaches other hosts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="img-src fig: figo: data:; connect-src 'self' figo:; object-src 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
